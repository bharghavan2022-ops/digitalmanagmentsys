name: Check live deployment

# Manual only, read-only: curls the live site to check its current status
# and response body, since this repo's usual dev sandbox has no network
# access to vercel.app.
on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npx prisma generate

      - name: Curl /login
        run: |
          echo "--- GET /login status ---"
          curl -sS -o response.html -w "%{http_code}\n" https://digitalmanagmentsys.vercel.app/login
          echo "--- Live buildId (changes every successful deploy - compare across runs) ---"
          grep -oE '"buildId":"[^"]+"' response.html || echo "buildId not found in HTML"
          echo "--- Response body (first 60 lines) ---"
          head -n 60 response.html

      - name: Sign in as a seeded demo account against Supabase Auth directly
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          echo "--- Auth token grant status ---"
          curl -sS -X POST "$NEXT_PUBLIC_SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"email":"admin.priya@nssdemo.local","password":"NssDemo#2026"}' \
            -o auth_response.json -w "%{http_code}\n"
          echo "--- Auth response (access_token redacted) ---"
          sed 's/"access_token":"[^"]*"/"access_token":"<redacted>"/;s/"refresh_token":"[^"]*"/"refresh_token":"<redacted>"/' auth_response.json

      - name: Check /post-login redirects rather than crashing when unauthenticated
        run: |
          echo "--- GET /post-login (no auth) status + redirect target ---"
          curl -sS -o /dev/null -w "status=%{http_code} redirect_url=%{redirect_url}\n" https://digitalmanagmentsys.vercel.app/post-login

      - name: Check the Digital ID QR link (/verify/profile/[id]) actually resolves
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node -e "
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          prisma.volunteerProfile.findFirst({ where: { fullName: 'Aditya Kumar' } })
            .then((v) => { if (!v) throw new Error('seeded volunteer not found'); console.log(v.id); })
            .finally(() => prisma.\$disconnect());
          " > volunteer_id.txt
          VOLUNTEER_ID=$(cat volunteer_id.txt)
          echo "Testing /verify/profile/$VOLUNTEER_ID"
          curl -sS -o profile_card.html -w "status=%{http_code}\n" "https://digitalmanagmentsys.vercel.app/verify/profile/$VOLUNTEER_ID"
          echo "--- Contains volunteer name? ---"
          grep -o "Aditya Kumar" profile_card.html || echo "NOT FOUND"
          echo "--- Leaks email anywhere? (should be empty) ---"
          grep -o "nssdemo.local" profile_card.html || echo "(none found - correct)"
