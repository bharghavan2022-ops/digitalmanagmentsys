name: Show schema drift

# Manual only, read-only: prisma migrate diff never writes to the database,
# it only compares prisma/schema.prisma against the live schema and prints
# the exact SQL needed to close any gap. Useful whenever a Prisma error like
# "column X does not exist" suggests a migration was never actually applied.
on:
  workflow_dispatch: {}

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # DIRECT_URL (Supabase's non-pooled port 5432) needs IPv6, which
      # GitHub's runners don't have - it fails with P1001 (can't reach
      # server). DATABASE_URL (the pooled connection) works over IPv4 and
      # is what the app itself actually queries through, so it's the
      # correct one to diff against anyway.
      - run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
