name: Screenshot live internal UI

# Manual only, read-only against the app (it does sign in, but never
# mutates data): logs in as a seeded demo account on the real deployment
# and screenshots a few authenticated pages, since the usual dev sandbox
# has no network path to Supabase or vercel.app to do this itself.
on:
  workflow_dispatch: {}

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Log in and capture screenshots (with diagnostics)
        run: |
          node -e "
          const { chromium } = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch({ args: ['--no-sandbox'] });
            const page = await (await browser.newContext({ viewport: { width: 1280, height: 900 } })).newPage();
            page.on('console', (msg) => console.log('BROWSER-CONSOLE[' + msg.type() + ']:', msg.text()));
            page.on('pageerror', (err) => console.log('BROWSER-PAGEERROR:', err.message));
            page.on('response', (res) => {
              if (res.status() >= 400) console.log('HTTP-' + res.status() + ':', res.url());
            });

            await page.goto('https://digitalmanagmentsys.vercel.app/login', { waitUntil: 'networkidle' });
            const buildId = await page.evaluate(() => {
              const m = document.documentElement.innerHTML.match(/\"buildId\":\"([^\"]+)\"/);
              return m ? m[1] : 'NOT FOUND';
            });
            console.log('LIVE-BUILD-ID:', buildId);
            await page.screenshot({ path: 'login-page.png' });

            await page.fill('#email', 'admin.priya@nssdemo.local');
            await page.fill('#password', 'NssDemo#2026');
            await page.click('button[type=submit]');

            try {
              await page.waitForURL('**/admin/dashboard', { timeout: 30000 });
              console.log('REDIRECT-OK: reached', page.url());
            } catch (e) {
              console.log('REDIRECT-TIMEOUT: current URL is', page.url());
              console.log('PAGE-TEXT-SNIPPET:', (await page.textContent('body')).slice(0, 500));
            }
            await page.screenshot({ path: 'admin-dashboard.png' });

            await page.goto('https://digitalmanagmentsys.vercel.app/admin/volunteers', { waitUntil: 'networkidle' });
            await page.screenshot({ path: 'admin-volunteers.png' });

            await browser.close();
          })().catch((e) => { console.error(e); process.exit(1); });
          "

      - name: Base64-encode screenshots for log capture
        if: always()
        run: |
          echo '===LOGIN-BASE64-START==='
          base64 -w 200 login-page.png || true
          echo '===LOGIN-BASE64-END==='
          echo '===DASHBOARD-BASE64-START==='
          base64 -w 200 admin-dashboard.png || true
          echo '===DASHBOARD-BASE64-END==='
          echo '===VOLUNTEERS-BASE64-START==='
          base64 -w 200 admin-volunteers.png || true
          echo '===VOLUNTEERS-BASE64-END==='

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: |
            login-page.png
            admin-dashboard.png
            admin-volunteers.png
          if-no-files-found: ignore
