name: Seed demo accounts

# Manual only - this writes real accounts into the live Supabase project via
# npm run prisma:seed (see prisma/seed.ts). It's idempotent (safe to re-run),
# but it's still a real write against production data, not something that
# should run on every push.
on:
  workflow_dispatch: {}

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @supabase/supabase-js 2.116 requires Node >=22 (its realtime
          # client needs a native WebSocket global) - Node 20 throws
          # "native WebSocket not found" the moment createClient() runs.
          node-version: 22

      - run: npm ci

      - run: npx prisma generate

      - run: npm run prisma:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
